/* ================= AUDIO (WebAudio, sin assets) ================= */
let actx = null;
function AC(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, dur, type='square', vol=0.12, delay=0, slideTo=null){
  try{
    const a=AC(), o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, a.currentTime+delay);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+delay+dur);
    g.gain.setValueAtTime(vol, a.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+delay+dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+delay); o.stop(a.currentTime+delay+dur+.02);
  }catch(e){}
}

/* ================= TERMINALES ================= */
class Terminal {
  constructor(){
    this.canvas = document.createElement('canvas');
    this.canvas.width = 512; this.canvas.height = 300;
    this.ctx = this.canvas.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.canvas);
    this.tex.colorSpace = THREE.SRGBColorSpace;
    this.lines = [];
    this.lineTimer = 0;
    this.state = 'code';          // code | prompt | dead
    this.promptTime = 0;
    this.promptMax = 1;
    for(let i=0;i<12;i++) this.addLine();
  }
  addLine(){
    this.lines.push(S.codeLines[(Math.random()*S.codeLines.length)|0]);
    if(this.lines.length > 14) this.lines.shift();
  }
  tick(dt, t, gameOn){
    if(this.state === 'code' && gameOn){
      this.lineTimer -= dt;
      if(this.lineTimer <= 0){
        this.addLine();
        G.score += 3;
        this.lineTimer = .25 + Math.random()*.6;
      }
    }
    this.draw(t);
    this.tex.needsUpdate = true;
  }
  draw(t){
    const c = this.ctx;
    if(this.state === 'dead'){
      c.fillStyle = '#010102';
      c.fillRect(0,0,512,300);
      if(Math.sin(t*1.5) > .8){
        c.fillStyle = '#1a1a22';
        c.font = '14px monospace';
        c.textAlign = 'center';
        c.fillText(S.noSignal, 256, 150);
        c.textAlign = 'left';
      }
      return;
    }
    const prompting = this.state === 'prompt';
    c.fillStyle = prompting ? '#1a0505' : '#020a06';
    c.fillRect(0,0,512,300);
    c.font = '15px monospace';
    this.lines.forEach((ln, i) => {
      c.fillStyle = prompting ? '#774444' : (i === this.lines.length-1 ? '#aaffcc' : '#2fd47a');
      c.fillText(ln, 14, 26 + i*19);
    });
    // cursor
    if(!prompting && Math.sin(t*5) > 0){
      c.fillStyle = '#aaffcc';
      c.fillRect(14 + c.measureText(this.lines[this.lines.length-1]).width + 4, 26 + (this.lines.length-1)*19 - 13, 9, 15);
    }
    if(prompting){
      const blink = Math.sin(t*8) > 0;
      c.fillStyle = 'rgba(60,0,0,.88)';
      c.fillRect(46, 78, 420, 144);
      c.strokeStyle = blink ? '#ff3344' : '#882222';
      c.lineWidth = 4;
      c.strokeRect(46, 78, 420, 144);
      c.fillStyle = blink ? '#ffee00' : '#ff3344';
      c.font = 'bold 30px monospace';
      c.textAlign = 'center';
      c.fillText(S.promptTitle, 256, 128);
      c.font = '17px monospace';
      c.fillStyle = '#ff8899';
      c.fillText(S.promptHelp, 256, 162);
      // barra de tiempo
      const p = Math.max(0, this.promptTime / this.promptMax);
      c.fillStyle = '#440000';
      c.fillRect(76, 186, 360, 14);
      c.fillStyle = p > .35 ? '#ffcc33' : '#ff3344';
      c.fillRect(76, 186, 360*p, 14);
      c.textAlign = 'left';
    }
  }
}

/* ================= AURA DE SELECCIÓN ================= */
let _auraTex = null;
function getAuraTexture(){
  if(_auraTex) return _auraTex;
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  const grd = x.createRadialGradient(64, 64, 18, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,.9)');
  grd.addColorStop(.55, 'rgba(255,255,255,.35)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = grd;
  x.fillRect(0, 0, 128, 128);
  _auraTex = new THREE.CanvasTexture(c);
  return _auraTex;
}

const monitors = [];
function makeMonitor(x, z, ry, idx){
  const g = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, .9, .06), M.frame);
  g.add(frame);
  const term = new Terminal();
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.4, .82),
    new THREE.MeshBasicMaterial({ map: term.tex }));
  screen.position.z = .035;
  g.add(screen);
  // aura de la pantalla seleccionada
  const aura = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 1.5),
    new THREE.MeshBasicMaterial({
      map: getAuraTexture(), transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false, color:0x66ccff,
    }));
  aura.position.z = -.04;
  g.add(aura);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(.08, .35, .06), M.frame);
  neck.position.y = -.6;
  g.add(neck);
  const base = new THREE.Mesh(new THREE.BoxGeometry(.5, .04, .32), M.frame);
  base.position.y = -.78;
  g.add(base);
  g.position.set(x, 1.62, z);
  g.rotation.y = ry;
  scene.add(g);
  const light = new THREE.PointLight(0x33ff88, .8, 3.2, 1.8);
  light.position.set(x*1.05, 1.6, z + .55);
  scene.add(light);
  monitors.push({ group:g, term, light, aura, idx });
}

const wizard = { obj:null, mixer:null, actions:{}, bones:{}, current:null, idle:'Sit_Cross_Legged_on_Floor' };
// ajustes de brazos sobre la animación (sube/baja estos valores si el brazo se mueve raro)
const ARM_TUNE = { reachX: -.34, foreX: -.42, sideZ: .5, spineY: .22 };

function playWizard(name, fade=.35, once=false, timeScale=1){
  if(!wizard.mixer) return;
  const a = wizard.actions[name];
  if(!a) return;
  a.reset();
  a.timeScale = timeScale;
  if(once){ a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
  else a.setLoop(THREE.LoopRepeat, Infinity);
  if(wizard.current && wizard.current !== a){
    wizard.current.fadeOut(fade);
    a.fadeIn(fade);
  }
  a.play();
  wizard.current = a;
}

let chara = localStorage.getItem('ps2026_char') || 'dev';   // dev | wizard
let wizardLoading = false;
function wizardActive(){ return chara === 'wizard' && wizard.obj; }

function loadWizard(){
  if(wizardLoading || wizard.obj) return;
  wizardLoading = true;
  new GLTFLoader().setMeshoptDecoder(MeshoptDecoder)
  .load('mago_web.glb', gltf=>{
    const obj = gltf.scene;
    obj.scale.setScalar(.95);
    obj.position.set(0, .62, .97);  // levitando sobre la silla
    obj.rotation.y = Math.PI;       // mirando a los monitores
    obj.visible = chara === 'wizard';
    scene.add(obj);
    wizard.obj = obj;
    obj.traverse(n=>{
      if(!n.isBone) return;
      const nm = n.name;
      if(nm.endsWith('RightArm'))      wizard.bones.armR  = n;
      if(nm.endsWith('RightForeArm'))  wizard.bones.foreR = n;
      if(nm.endsWith('LeftArm'))       wizard.bones.armL  = n;
      if(nm.endsWith('LeftForeArm'))   wizard.bones.foreL = n;
      if(nm.endsWith('Spine1'))        wizard.bones.spine = n;
    });
    wizard.mixer = new THREE.AnimationMixer(obj);
    for(const clip of gltf.animations) wizard.actions[clip.name] = wizard.mixer.clipAction(clip);
    playWizard(wizard.idle);
    wizard.mixer.addEventListener('finished', ()=>{
      if(G.state === 'playing') playWizard(wizard.idle, .4);
    });
  }, undefined, err => {
    console.warn('GLB no cargado; usando muñeco procedural:', err);
    if(chara === 'wizard') setChara('dev');   // si falla, vuelve al dev
    showMsg(location.protocol === 'file:'
      ? '⚠ El navegador bloquea mago_web.glb desde file:// — usa un servidor local: python -m http.server 8000'
      : '⚠ No se encontró mago_web.glb — súbelo a la misma carpeta que index.html', 9000);
  });
}

function refreshScrHud(){
  for(const m of monitors){
    $('scr'+m.idx).className = 'scr'
      + (m.term.state === 'dead'   ? ' dead'   : '')
      + (m.term.state === 'prompt' ? ' prompt' : '')
      + (m.idx === G.sel && m.term.state !== 'dead' ? ' active' : '');
  }
}

function refreshYoloHud(){
  const pct = G.yoloActive > 0 ? G.yoloActive/YOLO_TIME : G.yolo;
  $('yolo-fill').style.width = (pct*100) + '%';
  $('yolo-fill').classList.toggle('full', G.yolo >= 1 || G.yoloActive > 0);
  $('yolo-hud').classList.toggle('full', G.yolo >= 1 && !G.yoloActive);
}

function startGame(){
  AC().resume && AC().resume();
  G.state = 'playing';
  G.punch = 1;
  sStart();
  bgm.play().catch(()=>{});
  overlay.classList.add('hidden');
  $('hud').classList.add('on');
  $('screens-hud').classList.add('on');
  $('yolo-hud').classList.add('on');
  refreshScrHud();
  refreshYoloHud();
  showMsg(S.startMsg, 3000);
}

function aliveScreens(){ return monitors.filter(m => m.term.state !== 'dead'); }
function promptingScreens(){ return monitors.filter(m => m.term.state === 'prompt'); }

function moveSel(dir){
  const alive = aliveScreens().map(m => m.idx);
  if(!alive.length) return;
  let i = alive.indexOf(G.sel);
  i = i < 0 ? 0 : (i + dir + alive.length) % alive.length;
  if(alive[i] === G.sel) return;
  G.sel = alive[i];
  sMove(dir);
  refreshScrHud();
}

function tryPrompt(){
  const cand = aliveScreens().filter(m => m.term.state === 'code');
  if(!cand.length){ G.nextPrompt = 1; return; }
  const m = cand[(Math.random()*cand.length)|0];
  const prog = 1 - G.timeLeft/G.duration;
  m.term.state = 'prompt';
  m.term.promptMax = m.term.promptTime = THREE.MathUtils.lerp(15, 7, prog);
  sAlarm();
  G.shake = Math.max(G.shake, .12);
  showMsg(S.alert(S.screenNames[m.idx]), 2000);
  refreshScrHud();
}

function killScreen(m, reason){
  m.term.state = 'dead';
  sDead();
  G.shake = Math.max(G.shake, .3);
  playWizard('Sit_Finger_Wag_No', .25, true);   // el mago lamenta la pérdida
  if(G.sel === m.idx && aliveScreens().length) G.sel = aliveScreens()[0].idx;
  refreshScrHud();
  showMsg(reason, 2800);
  if(!aliveScreens().length) gameOver();
}

function answerYes(){
  sClack();
  const p = promptingScreens();
  if(!p.length){ G.score += 5; return; }
  const m = monitors[G.sel];
  if(m.term.state !== 'prompt'){   // hay un aviso, pero no estás sentado ahí
    sWrong();
    G.shake = Math.max(G.shake, .08);
    showMsg(S.wrongScreen);
    return;
  }
  m.term.state = 'code';
  refreshScrHud();
  G.score += 50;
  sYes();
  playWizard('Sit_Cheer_with_Left_Hand', .25, true);   // celebra sin levantarse
  const wasFull = G.yolo >= 1;
  G.yolo = Math.min(1, G.yolo + .2);
  refreshYoloHud();
  if(G.yolo >= 1 && !wasFull){ tone(1046,.2,'square',.12); showMsg(S.yoloReady, 2600); }
  else showMsg(S.yesMsgs[(Math.random()*S.yesMsgs.length)|0]);
}

function answerNo(){
  const m = monitors[G.sel];
  if(m.term.state !== 'prompt') return;
  killScreen(m, S.noMsg);
}

/* ================= MODO YOLO ================= */
function tryYolo(){
  if(G.state !== 'playing' || G.yoloActive > 0 || G.yolo < 1) return;
  G.yolo = 0;
  G.yoloActive = YOLO_TIME;
  sYolo();
  bgm.playbackRate = 1.4;                     // música turbo
  document.body.classList.add('yolo-mode');
  $('yolo-banner').textContent = S.yoloOn;
  playWizard('Sit_Cheer_with_Left_Hand', .2); // celebración en bucle
  if(wizard.current) wizard.current.timeScale = 1.7;
  G.shake = Math.max(G.shake, .25);
  showMsg(S.yoloOn, 2500);
  refreshYoloHud();
}
function endYolo(silent){
  if(!document.body.classList.contains('yolo-mode')) return;
  document.body.classList.remove('yolo-mode');
  G.yoloActive = 0;
  bgm.playbackRate = 1;
  bloom.strength = .75;
  camera.fov = 48;
  camera.updateProjectionMatrix();
  wizardGlow.intensity = 0;
  neonLight.color.setHex(0xff2fd6);
  playWizard(wizard.idle, .5);
  if(!silent) showMsg(S.yoloEnd);
  refreshYoloHud();
}

function gameOver(){
  G.state = 'over';
  endYolo(true);
  sLose();
  alertLight.intensity = 4;
  playWizard(wizard.idle, .6, false, .25);   // se hunde en cámara lenta
  setOverlay(S.overHtml(G.score, fmtTime(G.duration - G.timeLeft)));
}
function gameWin(){
  G.state = 'win';
  endYolo(true);
  sWin();
  playWizard('Sit_Cheer_with_Left_Hand', .4);   // celebración en bucle
  setOverlay(S.winHtml(G.score, aliveScreens().length));
}

function fmtTime(s){
  s = Math.max(0, Math.ceil(s));
  return String((s/60)|0).padStart(2,'0') + ':' + String(s%60|0).padStart(2,'0');
}

addEventListener('keydown', e=>{
  if(e.repeat) return;
  // volumen de la música (en cualquier momento)
  if(e.code === 'Equal' || e.code === 'NumpadAdd'){ setVol(bgm.volume + .1); return; }
  if(e.code === 'Minus' || e.code === 'NumpadSubtract'){ setVol(bgm.volume - .1); return; }
  if(G.state === 'intro'){
    if(e.code === 'Digit1' || e.code === 'Numpad1'){ setLang('en'); return; }
    if(e.code === 'Digit2' || e.code === 'Numpad2'){ setLang('es'); return; }
    if(e.code === 'Digit3' || e.code === 'Numpad3'){ setChara('dev'); return; }
    if(e.code === 'Digit4' || e.code === 'Numpad4'){ setChara('wizard'); return; }
    if(e.code === 'Enter'){ startGame(); return; }
    return;
  }
  if(e.code === 'Enter' || e.code === 'KeyY'){
    if(G.state === 'over' || G.state === 'win'){ location.reload(); return; }
    devPunch = 1;
    answerYes();
  }
  if(G.state === 'playing'){
    if(e.code === 'Space'){ e.preventDefault(); tryYolo(); }
    if(e.code === 'KeyN'){ devPunch = 1; answerNo(); }
    if(e.code === 'ArrowLeft'  || e.code === 'KeyA') moveSel(-1);
    if(e.code === 'ArrowRight' || e.code === 'KeyD') moveSel(1);
  }
});

/* ================= BUCLE ================= */
const clock = new THREE.Clock();
let lastSec = -1;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  selSmooth += (G.sel - selSmooth) * Math.min(1, dt*5);
  const selX = selSmooth - 1;   // -1 izq, 0 centro, 1 dcha

  /* --- cámara --- */
  if(G.state === 'intro'){
    G.introT = Math.min(1, G.introT + dt/5);
    const k = G.introT*G.introT*(3-2*G.introT); // smoothstep
    camera.position.lerpVectors(CAM_START, CAM_BASE, k);
    camera.position.y += Math.sin(t*.8)*.15*(1-k);
    camera.lookAt(CAM_LOOK);
  } else {
    const sway = .04;
    camera.position.x = CAM_BASE.x + selX*.5 + Math.sin(t*.5)*sway + mouse.x*.35;
    camera.position.y = CAM_BASE.y + Math.sin(t*.7)*sway*.6 - mouse.y*.2;
    camera.position.z = CAM_BASE.z - G.punch*.55;
    G.punch = Math.max(0, G.punch - dt*2.2);
    if(G.shake > 0){
      camera.position.x += (Math.random()-.5)*G.shake;
      camera.position.y += (Math.random()-.5)*G.shake;
      G.shake = Math.max(0, G.shake - dt*.8);
    }
    camera.lookAt(CAM_LOOK.x + selX*.7, CAM_LOOK.y, CAM_LOOK.z);
  }

  /* --- juego --- */
  const gameOn = G.state === 'playing';
  if(gameOn){
    G.timeLeft -= dt;
    const prog = 1 - G.timeLeft/G.duration;
    G.nextPrompt -= dt;
    if(G.nextPrompt <= 0){
      tryPrompt();
      G.nextPrompt = THREE.MathUtils.lerp(8, 3, prog) * (.7 + Math.random()*.6);
      if(G.yoloActive > 0) G.nextPrompt *= .45;   // en yolo llueven avisos
    }
    for(const m of monitors){
      if(m.term.state === 'prompt'){
        m.term.promptTime -= dt;
        if(m.term.promptTime <= 0)
          killScreen(m, S.timeoutMsg);
      }
    }
    if(G.timeLeft <= 0 && G.state === 'playing') gameWin();
    const sec = Math.ceil(G.timeLeft);
    if(sec !== lastSec){
      lastSec = sec;
      $('timer').textContent = fmtTime(G.timeLeft);
      $('timer').classList.toggle('low', G.timeLeft < 30);
      $('score').textContent = S.linesHud + G.score;
    }
  }

  /* --- terminales, auras y luces de pantalla --- */
  const anyPrompt = promptingScreens().length > 0;
  alertLight.intensity = THREE.MathUtils.lerp(
    G.state === 'over' ? 4 : (anyPrompt ? 2.5 + Math.sin(t*10)*1.2 : 0),
    alertLight.intensity, .85);
  alertLight.intensity = anyPrompt || G.state==='over' ? alertLight.intensity : Math.max(0, alertLight.intensity - dt*8);

  for(const m of monitors){
    m.term.tick(dt, t, gameOn);
    const s = m.term.state;
    const tgt = s === 'dead' ? 0 : s === 'prompt' ? 2.4 + Math.sin(t*10)*.8 : .8;
    m.light.intensity += (tgt - m.light.intensity) * Math.min(1, dt*8);
    m.light.color.setHex(s === 'prompt' ? 0xff3344 : 0x33ff88);
    const auraTgt = (m.idx === G.sel && s !== 'dead' && G.state !== 'over')
      ? .4 + .12*Math.sin(t*4) : 0;
    m.aura.material.opacity += (auraTgt - m.aura.material.opacity) * Math.min(1, dt*6);
  }

  /* --- MODO YOLO: auto-yes + fiesta visual --- */
  if(G.yoloActive > 0 && gameOn){
    G.yoloActive -= dt;
    const p = promptingScreens();
    if(p.length){                     // el mago responde solo, estés donde estés
      const m = p[0];
      m.term.state = 'code';
      G.score += 100;
      sYes();
      G.shake = Math.max(G.shake, .06);
      refreshScrHud();
    }
    const hue = (t*.45) % 1;          // arcoíris por todas partes
    alertLight.color.setHSL(hue, 1, .55);
    alertLight.intensity = 3 + Math.sin(t*12)*1.5;
    neonLight.color.setHSL((hue + .33) % 1, 1, .6);
    wizardGlow.color.setHSL((hue + .66) % 1, 1, .6);
    wizardGlow.intensity = 3;
    bloom.strength = .9 + .45*Math.abs(Math.sin(t*6));
    camera.fov = 48 + Math.sin(t*10)*1.5;
    camera.updateProjectionMatrix();
    refreshYoloHud();
    if(G.yoloActive <= 0) endYolo();
  }

  /* --- animación del programador --- */
  const type = gameOn ? 1 : .3;
  if(wizardActive()){
    wizard.mixer.update(dt);
    if(wizard.obj){
      wizard.obj.position.y = .62 + Math.sin(t*1.3)*.03;  // flota, es un sabio
      wizard.obj.rotation.y += ((Math.PI + selX*.18) - wizard.obj.rotation.y) * Math.min(1, dt*5);
      wizard.obj.position.x += (selX*.15 - wizard.obj.position.x) * Math.min(1, dt*5);
      // manos sobre la zona del teclado de la pantalla seleccionada
      const b = wizard.bones, reach = type;
      if(b.armR){  b.armR.rotation.x  += ARM_TUNE.reachX*reach; b.armR.rotation.z += ARM_TUNE.sideZ*selX*reach; }
      if(b.foreR){ b.foreR.rotation.x += ARM_TUNE.foreX*reach; }
      if(b.armL){  b.armL.rotation.x  += ARM_TUNE.reachX*reach; b.armL.rotation.z += ARM_TUNE.sideZ*selX*reach; }
      if(b.foreL){ b.foreL.rotation.x += ARM_TUNE.foreX*reach; }
      if(b.spine){ b.spine.rotation.y += ARM_TUNE.spineY*selX*reach; }
    }
  } else {
    devPunch = Math.max(0, devPunch - dt*3.5);            // el manotazo decae
    const slam = devPunch*devPunch;
    armL.fore.rotation.x = -1.15 - slam*.45 + Math.sin(t*10)*.08*type;
    armR.fore.rotation.x = -1.15 - slam*.45 + Math.sin(t*10 + 1.6)*.08*type;
    armL.arm.rotation.x = -.5 - slam*.3;
    armR.arm.rotation.x = -.5 - slam*.3;
    armL.arm.rotation.z = -.25 - selX*.25;
    armR.arm.rotation.z =  .25 - selX*.25;
    dev.rotation.y = -selX*.2;
    dev.rotation.x = slam*.1;                             // se echa hacia adelante al pulsar
    torso.scale.y = 1 + Math.sin(t*1.8)*.012;                 // respiración
    headG.position.y = 1.5 + Math.sin(t*1.8)*.008 - slam*.06;
    headG.rotation.z = Math.sin(t*.6)*.04;
    // mira la pantalla seleccionada
    const headTargetY = (G.sel - 1) * .45;
    const headTargetX = .1 + Math.sin(t*.9)*.05 + slam*.3;
    headG.rotation.y += (headTargetY - headG.rotation.y) * Math.min(1, dt*5);
    headG.rotation.x += (headTargetX - headG.rotation.x) * Math.min(1, dt*5);
    if(kbLight) kbLight.intensity = .9 + slam*2.5;        // el RGB flashea con el manotazo
  }

  // neon parpadeo sutil
  neonLight.intensity = 3 + Math.sin(t*3)*.4;

  composer.render();
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* --- params de depuración: ?auto arranca solo, ?sel=0/1/2 fuerza pantalla, ?yolo carga la barra --- */
const qs = new URLSearchParams(location.search);
if(qs.has('sel')) G.sel = Math.min(2, Math.max(0, parseInt(qs.get('sel')) || 0));
if(qs.has('yolo')) G.yolo = 1;
if(qs.has('auto')) setTimeout(()=>{ overlay.style.transition='none'; startGame(); }, 100);
if(qs.has('bright')) scene.add(new THREE.AmbientLight(0xffffff, 2.5));
</script>
