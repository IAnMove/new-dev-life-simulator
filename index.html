let actx = null;
function AC(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, dur, type='square', vol=0.12, delay=0, slideTo=null){
  try{
    const a=AC(), o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, a.currentTime+delay);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+delay+dur);
    g.gain.setValueAtTime(vol, a.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+delay+dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+delay); o.stop(a.currentTime+delay+dur+.02);
  }catch(e){}
}

/* ================= TERMINALES ================= */
class Terminal {
  constructor(){
    this.canvas = document.createElement('canvas');
    this.canvas.width = 512; this.canvas.height = 300;
    this.ctx = this.canvas.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.canvas);
    this.tex.colorSpace = THREE.SRGBColorSpace;
    this.lines = [];
    this.lineTimer = 0;
    this.state = 'code';          // code | prompt | dead
    this.promptTime = 0;
    this.promptMax = 1;
    for(let i=0;i<12;i++) this.addLine();
  }
  addLine(){
    this.lines.push(S.codeLines[(Math.random()*S.codeLines.length)|0]);
    if(this.lines.length > 14) this.lines.shift();
  }
  tick(dt, t, gameOn){
    if(this.state === 'code' && gameOn){
      this.lineTimer -= dt;
      if(this.lineTimer <= 0){
        this.addLine();
        G.score += 3;
        this.lineTimer = .25 + Math.random()*.6;
      }
    }
    this.draw(t);
    this.tex.needsUpdate = true;
  }
  draw(t){
    const c = this.ctx;
    if(this.state === 'dead'){
      c.fillStyle = '#010102';
      c.fillRect(0,0,512,300);
      if(Math.sin(t*1.5) > .8){
        c.fillStyle = '#1a1a22';
        c.font = '14px monospace';
        c.textAlign = 'center';
        c.fillText(S.noSignal, 256, 150);
        c.textAlign = 'left';
      }
      return;
    }
    const prompting = this.state === 'prompt';
    c.fillStyle = prompting ? '#1a0505' : '#020a06';
    c.fillRect(0,0,512,300);
    c.font = '15px monospace';
    this.lines.forEach((ln, i) => {
      c.fillStyle = prompting ? '#774444' : (i === this.lines.length-1 ? '#aaffcc' : '#2fd47a');
      c.fillText(ln, 14, 26 + i*19);
    });
    // cursor
    if(!prompting && Math.sin(t*5) > 0){
      c.fillStyle = '#aaffcc';
      c.fillRect(14 + c.measureText(this.lines[this.lines.length-1]).width + 4, 26 + (this.lines.length-1)*19 - 13, 9, 15);
    }
    if(prompting){
      const blink = Math.sin(t*8) > 0;
      c.fillStyle = 'rgba(60,0,0,.88)';
      c.fillRect(46, 78, 420, 144);
      c.strokeStyle = blink ? '#ff3344' : '#882222';
      c.lineWidth = 4;
      c.strokeRect(46, 78, 420, 144);
      c.fillStyle = blink ? '#ffee00' : '#ff3344';
      c.font = 'bold 30px monospace';
      c.textAlign = 'center';
      c.fillText(S.promptTitle, 256, 128);
      c.font = '17px monospace';
      c.fillStyle = '#ff8899';
      c.fillText(S.promptHelp, 256, 162);
      // barra de tiempo
      const p = Math.max(0, this.promptTime / this.promptMax);
      c.fillStyle = '#440000';
      c.fillRect(76, 186, 360, 14);
      c.fillStyle = p > .35 ? '#ffcc33' : '#ff3344';
      c.fillRect(76, 186, 360*p, 14);
      c.textAlign = 'left';
    }
  }
}

const monitors = [];
function makeMonitor(x, z, ry, idx){
  const g = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, .9, .06), M.frame);
  g.add(frame);
  const term = new Terminal();
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.4, .82),
    new THREE.MeshBasicMaterial({ map: term.tex }));
  screen.position.z = .035;
  g.add(screen);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(.08, .35, .06), M.frame);
  neck.position.y = -.6;
  g.add(neck);
  const base = new THREE.Mesh(new THREE.BoxGeometry(.5, .04, .32), M.frame);
  base.position.y = -.78;
  g.add(base);
  g.position.set(x, 1.62, z);
  g.rotation.y = ry;
  scene.add(g);
  const light = new THREE.PointLight(0x33ff88, .8, 3.2, 1.8);
  light.position.set(x*1.05, 1.6, z + .55);
  scene.add(light);
  monitors.push({ group:g, term, light, idx });
}

/* ================= EL MAGO VIBECODER (GLB de Meshy) ================= */
const wizard = { obj:null, mixer:null, actions:{}, current:null, idle:'Sit_Cross_Legged_on_Floor' };

function playWizard(name, fade=.35, once=false, timeScale=1){
  if(!wizard.mixer) return;
  const a = wizard.actions[name];
  if(!a) return;
  a.reset();
  a.timeScale = timeScale;
  if(once){ a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
  else a.setLoop(THREE.LoopRepeat, Infinity);
  if(wizard.current && wizard.current !== a){
    wizard.current.fadeOut(fade);
    a.fadeIn(fade);
  }
  a.play();
  wizard.current = a;
}

new GLTFLoader().setMeshoptDecoder(MeshoptDecoder)
  .load('mago_web.glb', gltf=>{
    const obj = gltf.scene;
    obj.scale.setScalar(.95);
    obj.position.set(0, .6, .85);   // levitando sobre la silla
    obj.rotation.y = Math.PI;       // mirando a los monitores
    scene.add(obj);
    scene.remove(dev);              // sustituye al muñeco procedural
    wizard.obj = obj;
    wizard.mixer = new THREE.AnimationMixer(obj);
    for(const clip of gltf.animations) wizard.actions[clip.name] = wizard.mixer.clipAction(clip);
    playWizard(wizard.idle);
    wizard.mixer.addEventListener('finished', ()=>{
      if(G.state === 'playing') playWizard(wizard.idle, .4);
    });
  }, undefined, err => console.warn('GLB no cargado; usando muñeco procedural:', err));

/* ================= ESTADO DEL JUEGO ================= */
const G = {
  state: 'intro',       // intro | playing | over | win
  duration: 300,
  timeLeft: 300,
  score: 0,
  nextPrompt: 7,
  introT: 0,
  shake: 0,
  punch: 0,
};
const mouse = { x:0, y:0 };
addEventListener('mousemove', e=>{
  mouse.x = (e.clientX/innerWidth - .5);
  mouse.y = (e.clientY/innerHeight - .5);
});

const $ = id => document.getElementById(id);
const overlay = $('overlay');
let msgTimer = null;
function showMsg(text, dur=2400){
  const m = $('msg');
  m.textContent = text;
  m.classList.add('on');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=>m.classList.remove('on'), dur);
}
function setOverlay(html){
  overlay.innerHTML = html + `<p class="credit-line">${S.creditOverlay}</p>`;
  overlay.classList.remove('hidden');
}

function renderIntro(){
  setOverlay(S.introHtml + `<p class="langsel">${S.langFooter}</p>`);
}
renderIntro();
$('vol-label').textContent = S.musicLabel;
$('credit').innerHTML = S.creditCorner;
setVol(bgm.volume);   // pinta la barra inicial

function startGame(){
  AC().resume && AC().resume();
  G.state = 'playing';
  G.punch = 1;
  sStart();
  bgm.play().catch(()=>{});
  overlay.classList.add('hidden');
  $('hud').classList.add('on');
  $('screens-hud').classList.add('on');
  showMsg(S.startMsg, 3000);
}

function aliveScreens(){ return monitors.filter(m => m.term.state !== 'dead'); }
function promptingScreens(){ return monitors.filter(m => m.term.state === 'prompt'); }

function tryPrompt(){
  const cand = aliveScreens().filter(m => m.term.state === 'code');
  if(!cand.length){ G.nextPrompt = 1; return; }
  const m = cand[(Math.random()*cand.length)|0];
  const prog = 1 - G.timeLeft/G.duration;
  m.term.state = 'prompt';
  m.term.promptMax = m.term.promptTime = THREE.MathUtils.lerp(15, 7, prog);
  sAlarm();
  G.shake = Math.max(G.shake, .12);
  showMsg(S.alert(S.screenNames[m.idx]), 2000);
  $('scr'+m.idx).classList.add('prompt');
}

function killScreen(m, reason){
  m.term.state = 'dead';
  sDead();
  G.shake = Math.max(G.shake, .3);
  playWizard('Sit_Finger_Wag_No', .25, true);   // el mago lamenta la pérdida
  $('scr'+m.idx).classList.remove('prompt');
  $('scr'+m.idx).classList.add('dead');
  showMsg(reason, 2800);
  if(!aliveScreens().length) gameOver();
}

function answerYes(){
  sClack();
  const p = promptingScreens();
  if(!p.length){ G.score += 5; return; }
  const m = p[0];
  m.term.state = 'code';
  $('scr'+m.idx).classList.remove('prompt');
  G.score += 50;
  sYes();
  playWizard('Sit_Cheer_with_Left_Hand', .25, true);   // celebra sin levantarse
  showMsg(S.yesMsgs[(Math.random()*S.yesMsgs.length)|0]);
}

function answerNo(){
  const p = promptingScreens();
  if(!p.length) return;
  killScreen(p[0], S.noMsg);
}

function gameOver(){
  G.state = 'over';
  sLose();
  alertLight.intensity = 4;
  playWizard(wizard.idle, .6, false, .25);   // se hunde en cámara lenta
  setOverlay(S.overHtml(G.score, fmtTime(G.duration - G.timeLeft)));
}
function gameWin(){
  G.state = 'win';
  sWin();
  playWizard('Sit_Cheer_with_Left_Hand', .4);   // celebración en bucle
  setOverlay(S.winHtml(G.score, aliveScreens().length));
}

function fmtTime(s){
  s = Math.max(0, Math.ceil(s));
  return String((s/60)|0).padStart(2,'0') + ':' + String(s%60|0).padStart(2,'0');
}

addEventListener('keydown', e=>{
  if(e.repeat) return;
  // volumen de la música (en cualquier momento)
  if(e.code === 'Equal' || e.code === 'NumpadAdd'){ setVol(bgm.volume + .1); return; }
  if(e.code === 'Minus' || e.code === 'NumpadSubtract'){ setVol(bgm.volume - .1); return; }
  if(G.state === 'intro'){
    if(e.code === 'Digit1' || e.code === 'Numpad1'){ setLang('en'); return; }
    if(e.code === 'Digit2' || e.code === 'Numpad2'){ setLang('es'); return; }
    if(e.code === 'Enter'){ startGame(); return; }
    return;
  }
  if(e.code === 'Enter'){
    if(G.state === 'over' || G.state === 'win'){ location.reload(); return; }
    answerYes();
  }
  if(e.code === 'KeyN' && G.state === 'playing') answerNo();
});

/* ================= BUCLE ================= */
const clock = new THREE.Clock();
let lastSec = -1;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  /* --- cámara --- */
  if(G.state === 'intro'){
    G.introT = Math.min(1, G.introT + dt/5);
    const k = G.introT*G.introT*(3-2*G.introT); // smoothstep
    camera.position.lerpVectors(CAM_START, CAM_BASE, k);
    camera.position.y += Math.sin(t*.8)*.15*(1-k);
    camera.lookAt(CAM_LOOK);
  } else {
    const sway = .04;
    camera.position.x = CAM_BASE.x + Math.sin(t*.5)*sway + mouse.x*.35;
    camera.position.y = CAM_BASE.y + Math.sin(t*.7)*sway*.6 - mouse.y*.2;
    camera.position.z = CAM_BASE.z - G.punch*.55;
    G.punch = Math.max(0, G.punch - dt*2.2);
    if(G.shake > 0){
      camera.position.x += (Math.random()-.5)*G.shake;
      camera.position.y += (Math.random()-.5)*G.shake;
      G.shake = Math.max(0, G.shake - dt*.8);
    }
    camera.lookAt(CAM_LOOK);
  }

  /* --- juego --- */
  const gameOn = G.state === 'playing';
  if(gameOn){
    G.timeLeft -= dt;
    const prog = 1 - G.timeLeft/G.duration;
    G.nextPrompt -= dt;
    if(G.nextPrompt <= 0){
      tryPrompt();
      G.nextPrompt = THREE.MathUtils.lerp(8, 3, prog) * (.7 + Math.random()*.6);
    }
    for(const m of monitors){
      if(m.term.state === 'prompt'){
        m.term.promptTime -= dt;
        if(m.term.promptTime <= 0)
          killScreen(m, S.timeoutMsg);
      }
    }
    if(G.timeLeft <= 0 && G.state === 'playing') gameWin();
    const sec = Math.ceil(G.timeLeft);
    if(sec !== lastSec){
      lastSec = sec;
      $('timer').textContent = fmtTime(G.timeLeft);
      $('timer').classList.toggle('low', G.timeLeft < 30);
      $('score').textContent = S.linesHud + G.score;
    }
  }

  /* --- terminales y luces de pantalla --- */
  const anyPrompt = promptingScreens().length > 0;
  alertLight.intensity = THREE.MathUtils.lerp(
    G.state === 'over' ? 4 : (anyPrompt ? 2.5 + Math.sin(t*10)*1.2 : 0),
    alertLight.intensity, .85);
  alertLight.intensity = anyPrompt || G.state==='over' ? alertLight.intensity : Math.max(0, alertLight.intensity - dt*8);

  for(const m of monitors){
    m.term.tick(dt, t, gameOn);
    const s = m.term.state;
    const tgt = s === 'dead' ? 0 : s === 'prompt' ? 2.4 + Math.sin(t*10)*.8 : .8;
    m.light.intensity += (tgt - m.light.intensity) * Math.min(1, dt*8);
    m.light.color.setHex(s === 'prompt' ? 0xff3344 : 0x33ff88);
  }

  /* --- animación del programador --- */
  const type = gameOn ? 1 : .3;
  if(wizard.mixer){
    wizard.mixer.update(dt);
    if(wizard.obj) wizard.obj.position.y = .6 + Math.sin(t*1.3)*.03;  // flota, es un sabio
  } else {
    armL.fore.rotation.x = -1.15 + Math.sin(t*10)*.08*type;
    armR.fore.rotation.x = -1.15 + Math.sin(t*10 + 1.6)*.08*type;
    torso.scale.y = 1 + Math.sin(t*1.8)*.012;                 // respiración
    headG.position.y = 1.5 + Math.sin(t*1.8)*.008;
    headG.rotation.z = Math.sin(t*.6)*.04;
    // mira la pantalla que pide atención
    const p = promptingScreens()[0];
    const headTargetY = p ? (p.idx - 1) * .45 : Math.sin(t*.4)*.1;
    const headTargetX = p ? .12 : Math.sin(t*.9)*.05;
    headG.rotation.y += (headTargetY - headG.rotation.y) * Math.min(1, dt*5);
    headG.rotation.x += (headTargetX - headG.rotation.x) * Math.min(1, dt*5);
  }

  // neon parpadeo sutil
  neonLight.intensity = 3 + Math.sin(t*3)*.4;

  composer.render();
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
